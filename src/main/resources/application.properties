spring.application.name=technology-api
server.port=8080
logging.level.com.onclass=TRACE

# Define la url reactiva de conexion hacia MySQL.
spring.r2dbc.url=r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:technology_db}
spring.r2dbc.username=${DB_USER:technology_user}
spring.r2dbc.password=${DB_PASSWORD:technology_pass}

# Activa Flyway para ejecutar migraciones SQL.
spring.flyway.enabled=true
# Define la url JDBC usada por Flyway.
spring.flyway.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:technology_db}
spring.flyway.user=${DB_USER:technology_user}
spring.flyway.password=${DB_PASSWORD:technology_pass}
# Define la ubicacion de scripts de migracion.
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
